name: native_pip
description: AVPlayer view with system Picture in Picture for iOS (used by the IPTV player).
version: 0.0.1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: NativePipPlugin
