name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: |
          flutter create --platforms=android,ios --org com.aelshal --project-name iptv_player .
          python3 tool/patch_platforms.py .
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build APK
        run: flutter build apk --release
      - name: Rename
        run: cp build/app/outputs/flutter-apk/app-release.apk IPTV-Player.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: IPTV-Player.apk

  ios:
    # Apple requires uploads built with a current Xcode; macos-26 ships it.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      HAS_SIGNING: ${{ secrets.IOS_DIST_CERT_P12_BASE64 != '' && secrets.ASC_KEY_P8_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: |
          flutter create --platforms=android,ios --org com.aelshal --project-name iptv_player .
          python3 tool/patch_platforms.py .
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - name: Build iOS (Dart + pods)
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      # Without the Apple secrets: unsigned IPA (needs Sideloadly/AltStore to install).
      - name: Package unsigned IPA
        if: env.HAS_SIGNING != 'true'
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry IPTV-Player-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        if: env.HAS_SIGNING != 'true'
        with:
          name: ios-ipa
          path: IPTV-Player-unsigned.ipa

      # With the Apple secrets: sign and send to TestFlight.
      - uses: ruby/setup-ruby@v1
        if: env.HAS_SIGNING == 'true'
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Sign and upload to TestFlight
        if: env.HAS_SIGNING == 'true'
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROFILE_APP_BASE64: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: bundle exec fastlane ios beta

  release:
    needs: [android, ios]
    if: ${{ always() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: IPTV Player 1.0.${{ github.run_number }}
          body: |
            Android: install **IPTV-Player.apk** (allow "Install unknown apps").
            iOS: installed through TestFlight once the Apple secrets are set (see README).
          files: dist/*
