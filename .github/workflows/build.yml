name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: |
          flutter create --platforms=android,ios --org com.aelshal --project-name iptv_player .
          python3 tool/patch_platforms.py .
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build APK
        run: flutter build apk --release
      - name: Rename
        run: cp build/app/outputs/flutter-apk/app-release.apk IPTV-Player.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: IPTV-Player.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: |
          flutter create --platforms=android,ios --org com.aelshal --project-name iptv_player .
          python3 tool/patch_platforms.py .
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry IPTV-Player-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: IPTV-Player-unsigned.ipa

  release:
    needs: [android, ios]
    if: ${{ always() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: IPTV Player 1.0.${{ github.run_number }}
          body: |
            Android: install **IPTV-Player.apk** (allow "Install unknown apps").
            iOS: **IPTV-Player-unsigned.ipa** must be signed to install (Sideloadly / AltStore with your Apple ID).
          files: dist/*
